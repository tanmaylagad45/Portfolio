name: Generate Contribution Snake Animation

on:
  # Schedule: runs every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows manual execution anytime via Actions tab
  workflow_dispatch:
  
  # Run on push to main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tanmaylagad45
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF88&color_dots=#0d1117,#0e4429,#006d32,#26a641,#00ff88

      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
